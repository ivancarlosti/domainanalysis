name: domainanalysis

services:
  domainanalysis:
    image: ghcr.io/ivancarlosti/domainanalysis:latest
    container_name: domainanalysis
    restart: unless-stopped
    # Create the environment file first: cp .env.example .env
    env_file:
      - .env
    environment:
      PORT: 3000
    ports:
      - "${PORT:-8080}:3000"
